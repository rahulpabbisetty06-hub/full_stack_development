<html>
    <head>
        <title>Advanced JavaScript</title>
    </head>
    <body>
        <script>
           //spread operator with arrays
           let numbers=[1,2,3,4];
           let more_numbers=[5,6,7,8];
           let combined_numbers=[...numbers,...more_numbers];  //combining the arrays using spread
           console.log(combined_numbers);

           let fruits=["apple","grapes","dragon"];
           let new_fruits=["mango",...fruits,"orange"];
           console.log(new_fruits);

           //spread operator with objects
           let person={
              name:"ramu",
              age:10,
              gender:"male"
           }
           let occupation={
               job:"teacher",
               address:"kavali"
           }
           let combine = {...person,...occupation};
           console.log(combine);
           
           let nest_obj = {...person,occupation:{...occupation}};
           console.log(nest_obj);

           let update_person = {name:"charan",age:40};
           let final_person  = {...person,...update_person};
           console.log(final_person);

           let final_occu = {...occupation,job:"professor",address:"nellore"};
           console.log(final_occu);

           //spread operator in function calls
           function product(a,b,c){
              return a*b*c;
           }
           const arr = [11,2,3];
           let result = product(...arr);
           console.log(result);

           //rest parameters
           function sum(...numbers){
              let total=0;
              for(let num of numbers){
                   total+=num;
              }
              console.log(total);
           }
           sum(1,2,3,4);

           //destructuring the array
            let colors = ["red", "green", "blue"];
            let [first_color, second_color, third_color] = colors;

            console.log(first_color);  
            console.log(second_color); 
            console.log(third_color);  

            let marks = [80, 90, 75];
            let [maths, , science] = marks;

            console.log(maths);   
            console.log(science); 

            //object destructuring
            let student = {
            student_name: "ravi",
            student_age: 18,
            course: "javascript"
            };

            let {student_name, student_age, course} = student;

            console.log(student_name); 
            console.log(student_age);  
            console.log(course);      

            let employee = {
            emp_name: "sita",
            salary: 30000
            };

            let {emp_name: name, salary: monthly_salary} = employee;

            console.log(name);           
            console.log(monthly_salary); 

            //function destructuring
            function display_student({student_name, course}) {
            console.log(student_name + " is learning " + course);
            }

            display_student(student);

            function display_colors([first, second]) {
            console.log(first);
            console.log(second);
            }

            display_colors(colors);

            //map() method
            const nums=[1,2,3,4];
            let cubes = nums.map((num,index)=>num*num*num);
            console.log(cubes);

            //filter() method
            const maxi=[1,2,30,4];
            let max_num = maxi.filter((num)=>num>10);
            console.log(max_num);

            //reduce() method
            let prices=[10,20,30,40];
            let total_price = prices.reduce(function(total, price) {
            return total + price;
            }, 0);
            console.log(total_price);
        </script>
    </body>
</html>
