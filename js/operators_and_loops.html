<!DOCTYPE html>
<html>
    <head>
       <title>Operators, Conditionals and Loops</title>
    </head>
    <body>
  
      <script>
            //operators
            // Arithmetic Operators
            let a = 10;
            let b = 5;

            console.log("Addition:", a + b);
            console.log("Subtraction:", a - b);
            console.log("Multiplication:", a * b);
            console.log("Division:", a / b);
            console.log("Modulus:", a % b);
            console.log("exponent:",a**b);

            //increment and decrement operators
            console.log("post-Increment:",a++);
            console.log("post-Decrement:",b--);
            console.log("pre-Increment:",++a);
            console.log("pre-Decrement:",--b);

            // Assignment Operators
            let x = 20;
            x += 5;
            console.log("x += 5:", x);
            
            let y = 17;
            y -= 3;
            console.log("y -= 3:", y);
            
            let z = 4;
            z *= 2;
            console.log("z *= 2:", z);
            
            let k=20;
            k /= 4;
            console.log("k /= 4:", k);

            // Comparison Operators
            let m = 10;
            let n="10";
            console.log("m == n:", m == n);
            console.log("m === n:", m === n);

            console.log("a != b:", a != b);
            console.log("a > b:", a > b);
            console.log("a < b:", a < b);
            console.log("a >= b:", a >= b);
            console.log("a <= b:", a <= b);

            // Logical Operators
            let age = 18;
            let hasID = true;

            console.log("AND:", age >= 18 && hasID);
            console.log("OR:", age >= 18 || hasID);
            console.log("NOT:", !hasID);

            //nullish coalescing
            let name=null;
            console.log(name??"default value");

            let sam=30;
            console.log(sam ?? 10);

            let another = null;
            another ??= 45;
            console.log(another);

            //typeof operator
            let type = "string";
            console.log(typeof type);

            //ternary operators
            let t_age=20;
            console.log(t_age>18 ? "eligible!" : "not eligible!");

            //conditionals
            // if condition
            if (age >= 18) {
            console.log("You are eligible to vote.");
            }

            // if-else condition
            if (a > b) {
            console.log("a is greater than b.");
            } 
            else {
            console.log("b is greater than a.");
            }

            // else-if condition
            let marks = 75;

            if (marks >= 90) {
            console.log("Grade A");
            } 
            else if (marks >= 75) {
            console.log("Grade B");
            } 
            else if (marks >= 50) {
            console.log("Grade C");
            }
            else {
            console.log("Fail");
            }

            // Nested if-else
            let username = "admin";
            let password = "1234";

            if (username === "admin") 
            {
                if (password === "1234") {
                    console.log("Login successful.");
                } 
                else {
                    console.log("Wrong password.");
                }
            } 
            else {
            console.log("Invalid username.");
            }

            // Switch statement
            let day = 3;

            switch (day) 
            {
                case 1:
                    console.log("Monday");
                    break;
                case 2:
                    console.log("Tuesday");
                    break;
                case 3:
                    console.log("Wednesday");
                    break;
                case 4:
                    console.log("Thursday");
                    break;
                case 5:
                    console.log("Friday");
                    break;
                default:
                    console.log("Weekend");
            }
            
            //loops
            // for loop
            for (let i = 1; i <= 5; i++) {
            console.log("For loop:", i);
            }

            // while loop
            let i = 1;

            while (i <= 5) {
            console.log("While loop:", i);
            i++;
            }

            // do-while loop
            let j = 1;

            do {
            console.log("Do-while loop:", j);
            j++;
            } while (j <= 5);

            // for-in loop
            let vegetables=["carrot","radish","cucumber"]

            for (let index in vegetables) {
                console.log(index);
                console.log(vegetables[index]);
            }

            // for-of loop
            let fruits = ["Apple", "Banana", "Mango"];

            for (let fruit of fruits) {
            console.log("Fruits:", fruit);
            }
            //Nested loops
            for (let i = 1; i <= 3; i++) {
                console.log("Outer loop:", i);

            for (let j = 1; j <= 2; j++) {
                console.log("Inner loop:", j);
            }
            }

  </script>
</body>
</html>
