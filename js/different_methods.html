<html>
    <head>
        <title>various methods</title>
    </head>
    <body>
        <script>
               //string methods
               let example="javascript is a scripting language";
               console.log(example.length);
               console.log(example.indexOf("is"));
               console.log(example.lastIndexOf("lang"));
               console.log(example.charAt(9));
               console.log(example.toUpperCase());
               console.log(example.toLowerCase());
               console.log(example.startsWith("scri",3));
               console.log(example.includes("lang"));
               //number methods
               let num=3.1415962;
               console.log(num.toFixed(2));
               console.log(typeof num.toString());
               console.log(num.toExponential(3));
               console.log(Number.MAX_VALUE);
               console.log(Number.POSITIVE_INFINITY);
               //array methods
               let fruits=["apple","banana","orange"];
               fruits.push("mango");
               console.log(fruits);
               fruits.pop();
               console.log(fruits);
               fruits.unshift("grapes");
               console.log(fruits);
               fruits.shift();
               console.log(fruits);
               console.log(fruits.indexOf("banana"));
               console.log(fruits.indexOf("mango"));
               console.log(fruits.reverse());
               console.log(fruits.includes("apple"));
               //Math object
               console.log(Math.PI);
               console.log(Math.abs(-100));
               console.log(Math.floor(4.2));
               console.log(Math.round(4.7));
               console.log(Math.sqrt(121));
               console.log(Math.cbrt(216));
               console.log(Math);
               console.log(Math.random());
               console.log(Math.max(10,40,100));
               console.log(Math.pow(2,3));
               //date objects
               let crr_date = new Date();
               console.log(crr_date);
               console.log(crr_date.getDate());
               console.log(crr_date.getMonth());
               console.log(crr_date.getFullYear());
               crr_date.setDate(1);
               let first_day_of_month = new Date(crr_date);
               console.log(crr_date);
               //constructor function
               function Person(first_name,last_name,age=20){
                this.first_name=first_name;
                this.last_name=last_name;
                this.age=age;
                this.getfulldetails = function(){
                   return `firstname:${first_name}\nlastname:${last_name}\nage:${age}`;
                }
               }
               let person1=new Person("jhon","Doe",10);
               let person2=new Person("mark","ram");
               console.log(person1);
               console.log(person2);
               console.log(person1.getfulldetails());
               console.log(person2.getfulldetails());
        </script>
    </body>
</html>
