<html>
    <head>
        <title>CSS BOX Model</title>
        <style>
            .box-model{
                text-align: center;
                width:300px;
                height: 100px;
                background-color: sandybrown;
                padding-left:20px;
                padding-right: 40px;
                padding-bottom: 10px;
                padding-top: 30px;
                border-top: 10px solid black;
                border-bottom: 10px dotted violet;
                border-left: 20px double slateblue;
                border-right: 20px dashed khaki;
                margin-left: 15px;
                margin-top: 10px;
                margin-bottom: 10px;
                margin-right: 15px;
            }    
            .short-hand-box{
                width:400px;
                height:200px;
                padding:10px 20px 10px 20px;
                border:5px 10px 5px 10px;
                border-color:blue green orange pink;
                border-style: dotted solid solid solid;
                margin: 30px 20px 50px 40px;
            }
            .container{
                padding:20px;
                background-color: grey;
                margin-bottom: 10px;
            }
            .box{
                background-color: aqua;
                padding: 20px;
                margin-top: 30px;
                display:inline-block;
                width:200px;
                height:100px;
            }
            .round-corner{
                /*border-radius: 30px;*/
                border-top-left-radius: 10px;
                border-top-right-radius: 20px;
                border-bottom-right-radius: 30px;
                border-bottom-left-radius: 40px;
            }
            .circle{
                height:100px;
                width:100px;
                border-radius:50%;
            }
        </style>
    </head>
    <body>
        <div class="box-model">
            content inside box
        </div>
        <div class="short-hand-box">
            content inside short hand box
        </div>
        <section class="container">
            <div class="box round-corner">box with rounded corners</div>
        </section>
        <section class="container">
            <div class="box circle">circle</div>
        </section>
    </body>
</html>
