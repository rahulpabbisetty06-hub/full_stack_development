<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video Tags</title>
</head>
<body>

    <h1>Audio and Video Tags in HTML</h1>

    <h2>Audio Example</h2>

    <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
        Your browser does not support the audio tag.
    </audio>

    <hr>

    <h2>Video Example</h2>

    <video width="500" height="300" controls poster="smile.jpeg">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        <source src="https://www.w3schools.com/html/mov_bbb.ogg" type="video/ogg">
        Your browser does not support the video tag.
    </video>

    <hr>
    
     <h2>Marquee tag</h2>
     <marquee behaviour="scroll" direction="right" scrollamount="15">marquee tag is used to scroll the text.</marquee>
</body>
</html>
